[project]
name = "tech-brief"
version = "0.1.0"
description = "Basic MCP server template"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2.0", "httpx>=0.27", "trafilatura>=2.0", "lxml>=5.0"]

[project.scripts]
tech-brief = "tech_brief.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_brief"]

[dependency-groups]
dev = ["pre-commit>=4.0", "ruff>=0.8", "mypy>=1.13", "lxml-stubs>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, C4 comprehensions
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
